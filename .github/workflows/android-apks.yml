name: Android APKs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@16f3e46a58d2b926c34615132d7969a96bccb22b # v6.0.0

      - name: Install Android SDK 37
        run: >
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3
          "platforms;android-37.0"
          "build-tools;37.0.0"

      - name: Test, lint, and build
        run: >
          ./gradlew --no-daemon
          testDebugUnitTest
          lintDebug
          assembleDebug
          assembleRelease

      - name: Check APK outputs
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualmesh-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualmesh-release-unsigned-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dualmesh-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Update development release
    needs: build
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download debug APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dualmesh-debug-${{ github.run_number }}
          path: release

      - name: Prepare release files
        run: |
          mv release/app-debug.apk release/dualmesh-development-debug.apk
          (
            cd release
            sha256sum dualmesh-development-debug.apk > SHA256SUMS.txt
          )
          {
            printf 'Automated development build from commit %s.\n\n' "$GITHUB_SHA"
            printf 'This APK uses Android debug signing. It is not a production release.\n\n'
            printf 'Build: https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > release-notes.md

      - name: Publish development release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view development > /dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/development" \
              -f sha="$GITHUB_SHA" \
              -F force=true > /dev/null
            gh release edit development \
              --title "DualMesh development build" \
              --notes-file release-notes.md \
              --prerelease
            gh release upload development \
              release/dualmesh-development-debug.apk \
              release/SHA256SUMS.txt \
              --clobber
          else
            if ! release_output=$(gh release create development \
              release/dualmesh-development-debug.apk \
              release/SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "DualMesh development build" \
              --notes-file release-notes.md 2>&1); then
              printf '::error title=Release creation failed::%s\n' "$release_output"
              exit 1
            fi
          fi
